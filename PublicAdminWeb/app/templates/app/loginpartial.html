{% if request.session.user %}
<ul class="navbar-nav">
    <li class="nav-item dropdown">
        <a class="nav-link dropdown-toggle active fw-bold" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="fas fa-user-circle fs-5"></i> Xin chào, {{ request.session.user }}!
        </a>
        <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="userDropdown">
            <li><a class="dropdown-item" href="{% url 'dashboard' %}"><i class="fas fa-chart-line text-primary"></i> Bảng điều khiển</a></li>
            <li><hr class="dropdown-divider"></li>
            <li>
                <form id="logoutForm" action="{% url 'logout' %}" method="post">
                    {% csrf_token %}
                    <button type="submit" class="dropdown-item text-danger">
                        <i class="fas fa-sign-out-alt"></i> Đăng xuất
                    </button>
                </form>
            </li>
        </ul>
    </li>
</ul>
{% else %}
<ul class="navbar-nav">
    <li class="nav-item">
        <a class="nav-link" href="{% url 'register' %}"><i class="fas fa-user-plus"></i> Đăng ký</a>
    </li>
    <li class="nav-item">
        <a class="nav-link btn btn-outline-light ms-2 px-3 fw-bold" href="{% url 'login' %}">
            <i class="fas fa-sign-in-alt"></i> Đăng nhập
        </a>
    </li>
</ul>
{% endif %}
